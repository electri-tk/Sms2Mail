name: Android Release CI/CD

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Java Ortamını Kur (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'gradle'

    - name: Keystore Dosyasını Çöz ve Oluştur
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-keystore.jks

    - name: Gradle'a Çalıştırma İzni Ver
      run: chmod +x gradlew

    - name: İmzalı Release APK Derle
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=release-keystore.jks \
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

    - name: APK Dosyasını Yeniden Adlandır
      id: rename_apk
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          VERSION_TAG="${{ github.event.release.tag_name }}"
        else
          VERSION_TAG="${{ github.ref_name }}"
        fi
        
        REPO_NAME="${{ github.event.repository.name }}"
        NEW_NAME="${REPO_NAME}-${VERSION_TAG}-release.apk"
        
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/$NEW_NAME
        echo "apk_path=app/build/outputs/apk/release/$NEW_NAME" >> $GITHUB_OUTPUT

    - name: Oluşan APK Dosyasını Yükle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: ${{ steps.rename_apk.outputs.apk_path }}
        retention-days: 7

    - name: APK'yı Doğrudan Release Sayfasına Yükle
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.rename_apk.outputs.apk_path }}
